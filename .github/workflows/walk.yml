name: Java Walk Test
on: push 

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf out-test out && mkdir -p out-test out && javac -d out-test --module-path "artifacts/info.kgeorgiy.java.advanced.base.jar:artifacts/info.kgeorgiy.java.advanced.walk.jar:lib" --module-source-path modules -m info.kgeorgiy.java.advanced.walk && javac -d out -cp "artifacts/info.kgeorgiy.java.advanced.base.jar" $(find info -name '*.java') && java --module-path "out-test:artifacts/info.kgeorgiy.java.advanced.base.jar:artifacts/info.kgeorgiy.java.advanced.walk.jar:lib" --add-modules info.kgeorgiy.java.advanced.walk -cp out info.kgeorgiy.java.advanced.walk.Tester Walk kgeorgiy.ja.codejava.walk.Walk
